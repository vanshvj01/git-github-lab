<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A3 Study Planner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>A3 Study Planner</h1>
    <p>DevOps Lab - Experiment 2 | Batch A3, KJSSE</p>
  </header>
  <main>
    <form id="task-form">
      <input id="subject" placeholder="Subject (e.g. DevOps)" required>
      <input id="task" placeholder="Task (e.g. Finish Exp 2 write-up)" required>
      <input id="due" type="date" required>
      <button type="submit">Add task</button>
    </form>
    <p id="summary"></p>
    <ul id="task-list"></ul>
  </main>
  <footer>Made by Vansh Vijayvargiya, Arjun Patil and Vedant Singh</footer>
  <script src="app.js"></script>
</body>
</html>
